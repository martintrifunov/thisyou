name: Windows

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Test
        shell: powershell
        run: .\build.ps1 -Task Test
      - name: Validate installer
        shell: powershell
        run: |
          $tokens = $null
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path .\install.ps1),
            [ref]$tokens,
            [ref]$errors
          )
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_ }
            exit 1
          }
          $archive = & .\install.ps1 -CheckArchitecture
          if ($archive -notin @("thisyou-windows-amd64.zip", "thisyou-windows-arm64.zip")) {
            throw "Unexpected installer archive: $archive"
          }
      - name: Build
        shell: powershell
        run: .\build.ps1 -Task Build
      - name: Verify executable
        shell: powershell
        run: .\thisyou.exe --version
