name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Test
        run: go test ./...
      - name: Vet
        run: go vet ./...
      - name: Build
        run: go build -trimpath -o ${{ runner.os == 'Windows' && 'thisyou.exe' || 'thisyou' }} ./cmd/thisyou
      - name: Verify executable
        shell: bash
        run: |
          if [[ "${RUNNER_OS}" == "Windows" ]]; then
            ./thisyou.exe --version
          else
            ./thisyou --version
          fi

  powershell:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Validate scripts
        shell: powershell
        run: |
          foreach ($file in @("build.ps1", "install.ps1")) {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $file),
              [ref]$tokens,
              [ref]$errors
            )
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error $_ }
              exit 1
            }
          }
          $archive = & .\install.ps1 -CheckArchitecture
          if ($archive -notin @("thisyou-windows-amd64.zip", "thisyou-windows-arm64.zip")) {
            throw "Unexpected installer archive: $archive"
          }
      - name: PowerShell build and test
        shell: powershell
        run: .\build.ps1 -Task Test
